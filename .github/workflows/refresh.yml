name: refresh
on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/scrape.mjs
      - name: Save data (keeps score history)
        run: |
          git config user.name "refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data refresh [skip ci]" && git push || true
      - run: mkdir _site && cp index.html data.json robots.txt _site/
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
